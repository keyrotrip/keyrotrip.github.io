# 잠금화면 알림을 15분마다 내보냅니다.
#
# **이 등급의 Supabase 에는 pg_cron 이 없습니다**(db/032·042 에 적어둔 것과
# 같은 사정). 때가 되면 도는 일을 맡을 곳이 필요한데, 저장소가 이미
# GitHub 에 있으니 여기가 제일 가깝습니다. 공개 저장소는 무료입니다.
#
# 두 가지를 알아두어야 합니다.
#   · GitHub 의 cron 은 **정확하지 않습니다.** 붐빌 때는 몇 분 늦습니다.
#     그래서 db/063 의 창을 20분으로 잡았습니다 — 한 번 늦어도 안 놓칩니다.
#     늦은 것이 두 번 걸리는 문제는 push_log 가 막습니다.
#   · 저장소가 60일 동안 조용하면 GitHub 이 예약을 멈춥니다.
#     그때는 Actions 탭에서 한 번 켜주면 됩니다.
#
# 넣어야 하는 값 (저장소 → Settings → Secrets and variables → Actions):
#   SUPABASE_URL        https://qahqqhjleqfrsjiixnas.supabase.co
#   SUPABASE_SERVICE_KEY  대시보드 → Project Settings → API → service_role
#     **service_role 키는 모든 것을 지나칩니다(RLS 를 안 봅니다).**
#     반드시 Secrets 에만 두고 코드에 적지 마세요.

name: push-reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:          # 손으로도 한 번 돌려볼 수 있게

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # 값이 비어 있으면 curl 이 "주소가 잘못됐다"(exit 3)로만 죽습니다.
      # 그 숫자만 보고는 무엇이 없는지 알 수가 없어서 먼저 확인합니다.
      # **값 자체는 절대 찍지 않습니다** — 로그는 공개 저장소에서 누구나 봅니다.
      - name: 넣어둔 값 확인
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ok=1
          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL 이 비어 있습니다. 저장소 Settings → Secrets and variables → Actions 에 넣어주세요."
            ok=0
          else
            echo "SUPABASE_URL 길이 ${#URL}"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::SUPABASE_SERVICE_KEY 가 비어 있습니다. Supabase → Project Settings → API → service_role 키입니다."
            ok=0
          else
            echo "SUPABASE_SERVICE_KEY 길이 ${#KEY}"
          fi
          test "$ok" = "1"

      - name: 보낼 것 내보내기
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # 주소 끝에 / 를 붙여둔 경우가 흔합니다. 붙어 있으면 // 가 되어 404 입니다.
          URL="${URL%/}"
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            "$URL/functions/v1/push" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}')
          body=$(cat /tmp/out.json)
          echo "HTTP $code"
          echo "$body"
          # 실패를 조용히 넘기면 알림이 몇 주째 안 가는 것을 아무도 모릅니다.
          # **답을 그대로 주석에 싣습니다.** 코드만 찍었더니 실패할 때마다
          # 로그를 열어봐야 했고, 그러느라 한 번 고칠 때마다 왕복이 생겼습니다.
          # 함수는 키 값을 답에 절대 안 싣습니다(공개 저장소 로그에 남습니다).
          if [ "$code" != "200" ]; then
            echo "::error::HTTP $code · $body"
          fi
          test "$code" = "200"
