# 배포 전 검사.
#
# **왜 생겼는지 적어둡니다.** b311 에서 템플릿 문자열 안에 백틱 하나가
# 들어가 app.js 가 파싱조차 안 됐는데, 그대로 GitHub Pages 에 올라갔고
# 사용자가 "불러오는 중만 뜬다"고 알려줄 때까지 아무도 몰랐습니다.
# 사람이 눈으로 잡을 종류가 아닙니다.
#
# 두 단계입니다.
#   1. 문법  — 의존성 없이 `node --check`. 빠르고 늘 됩니다.
#   2. 앱    — 진짜 브라우저로 띄우고 자체 점검 열한 개를 돌립니다.
#              제일 중요한 것은 '#sub 가 불러오는 중에서 벗어났는가' 입니다.
#
# ⚠ 이 검사는 **배포를 막지 않습니다.** GitHub Pages 는 push 하면 알아서
#   올라가고, 그 앞에 관문을 두려면 Pages 를 Actions 배포로 바꿔야 합니다.
#   지금은 "올라갔는데 빨간불" 을 보여주는 것까지입니다. 그것만으로도
#   b311 은 몇 분 만에 알아챘을 것입니다. 관문이 필요해지면 그때 바꿉니다.

name: check

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 문법
        run: node tools/check-syntax.mjs

      # 바꾸면 안 되는 값 — 아이콘을 담는 순간 굳는 상태바 방식·앱 주소·manifest id·로그인 저장 이름·초대 링크.
      # 바뀌면 모든 사용자가 아이콘을 다시 담거나 다시 로그인해야 합니다(2026-10-01 에 겪음). bump.sh 도 같은 검사를
      # 먼저 돌리지만, 손으로 고쳐 바로 올린 판도 여기서 잡힙니다. 절차는 tools/frozen.pl 머리말.
      - name: 바꾸면 안 되는 값
        run: perl tools/frozen.pl

      # 떼어낸 모듈이 app.js 에만 있던 이름을 그대로 들고 나왔는지 봅니다.
      # 문법은 멀쩡하고, 그 줄은 로그인해야 도니까 아래 브라우저 검사도
      # 못 잡습니다. 쪼개면서 두 번 같은 사고가 났습니다(shelfKind·avgTail).
      - name: 못 찾는 이름
        run: node tools/check-refs.mjs

      # 브라우저는 무겁습니다. 문법이 깨졌으면 여기까지 올 필요가 없어서
      # 위 단계가 실패하면 자동으로 멈춥니다.
      - name: 브라우저 설치
        run: npm install && npx playwright install --with-deps chromium

      - name: 앱이 뜨는가
        run: node tools/check-app.mjs
