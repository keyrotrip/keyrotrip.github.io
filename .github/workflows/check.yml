# 배포 전 검사 (+ 켜면: 검사를 통과한 «그 커밋»만 Pages 에 올리기).
#
# **왜 생겼는지 적어둡니다.** b311 에서 템플릿 문자열 안에 백틱 하나가
# 들어가 app.js 가 파싱조차 안 됐는데, 그대로 GitHub Pages 에 올라갔고
# 사용자가 "불러오는 중만 뜬다"고 알려줄 때까지 아무도 몰랐습니다.
# 사람이 눈으로 잡을 종류가 아닙니다.
#
# 검사 목록은 **tools/check-all.sh 한 곳**에 있습니다(2026-10-16). 로컬에서도 같은 것을
# `bash tools/check-all.sh` 로 돌립니다. 목록을 여기 따로 적으면 둘이 갈라집니다 —
# 실제로 perl 검사·서버(Deno) 검사는 손으로만 돌고 CI 에는 없었습니다.
#
# ── 배포 관문(deploy 일) ─────────────────────────────────────────────────
# 지금(Pages 원본 = 브랜치)은 push 하면 검사와 **상관없이** 올라가고, 이 검사는
# "올라갔는데 빨간불"을 보여 주는 것까지입니다.
# 아래 deploy 일은 **저장소 변수 PAGES_FROM_ACTIONS 가 'true' 일 때만** 돕니다. 그 전에는
# 건너뜁니다 — 이 파일을 올려도 배포 방식은 그대로입니다.
# 켜는 순서·되돌리는 법: docs/운영-설정-확인.md 「6. 검사 통과한 커밋만 배포」.
# 올리는 파일은 그 커밋의 파일 그대로(git archive)라 앱 주소·manifest id·로그인 저장 이름
# (t2-auth)·초대 링크(?join=)는 달라지지 않습니다. 올리기 직전에 frozen.pl 을 한 번 더 봅니다.

name: check

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm                 # package-lock.json 으로 받습니다

      # 서버 함수(Supabase Edge)는 Deno 로 돕니다. 로컬에서 쓴 판과 같은 판으로 못박습니다.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      # `npm install` 은 그날그날 다른 판을 받을 수 있습니다. `npm ci` 는 package-lock.json 그대로만.
      - name: 의존성(잠금 파일 그대로)
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      # CI=true 라서 «건너뜀»도 실패로 봅니다(도구가 없어서 못 돈 검사를 통과로 치지 않음).
      - name: 검사 전부 (tools/check-all.sh)
        run: bash tools/check-all.sh

  deploy:
    needs: check
    # 켜기 전에는 건너뜁니다(위 머리말). main 에 push 했거나 main 에서 손으로 돌렸을 때만.
    if: >-
      vars.PAGES_FROM_ACTIONS == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 한 번에 하나씩. 진행 중인 배포는 끊지 않습니다(반쯤 올라간 사이트를 만들지 않게).
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # 검사한 바로 그 커밋을 받습니다(브랜치 끝이 아니라).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # 검사하는 몇 분 사이에 더 새 커밋이 올라왔으면 이 판은 올리지 않습니다 —
      # 늦게 끝난 옛 판이 새 판을 덮어 되돌리는 일을 막습니다. 새 커밋은 자기 검사 뒤에 올라갑니다.
      - name: 아직 main 의 끝인가
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::main 이 이미 $tip 로 나아갔습니다 — 이 판($GITHUB_SHA)은 올리지 않습니다."
          fi

      - name: 바꾸면 안 되는 값(올릴 판으로 한 번 더)
        if: steps.tip.outputs.skip != '1'
        run: perl tools/frozen.pl

      # 저장소에 올라 있는 파일 그대로(지금 브랜치 배포와 같은 내용). 추적 안 하는 파일은 안 들어갑니다.
      - name: 올릴 파일 모으기
        if: steps.tip.outputs.skip != '1'
        run: |
          mkdir _site
          git archive --format=tar "$GITHUB_SHA" | tar -x -C _site
          test -f _site/index.html && test -f _site/manifest.json && test -f _site/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.tip.outputs.skip != '1'

      - uses: actions/upload-pages-artifact@v3
        if: steps.tip.outputs.skip != '1'
        with:
          path: _site

      - id: deployment
        if: steps.tip.outputs.skip != '1'
        uses: actions/deploy-pages@v4

  # ── 서버 함수 배포(2026-10-16 준비 — 켜기 전에는 건너뜀) ─────────────────────────────
  # 지금은 사람이 대시보드에 «붙여 넣어» 배포합니다 — 검사한 코드·의존성과 배포된 것이 같다는 보장이 없습니다.
  # 이 일은 check 가 통과한 «그 커밋»에서, supabase/functions 가 바뀐 경우에만 Supabase CLI 로 배포합니다.
  # 켜려면(사용자 승인 뒤): 저장소 Secrets 에 SUPABASE_ACCESS_TOKEN(Supabase → Account → Access Tokens),
  #   Variables 에 SUPABASE_PROJECT_REF(프로젝트 주소 앞부분) 과 FUNCTIONS_FROM_ACTIONS = true.
  #   자세한 순서·되돌리기: docs/운영-설정-확인.md 「10. 서버 함수 자동 배포」.
  # 입구 검사(verify_jwt)는 supabase/config.toml 의 값(넷 다 false — 함수가 스스로 인증)으로 배포됩니다.
  deploy-functions:
    needs: check
    if: >-
      vars.FUNCTIONS_FROM_ACTIONS == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-functions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # 더 새 커밋이 이미 main 에 있으면 옛 판으로 덮지 않습니다(위 deploy 일과 같은 까닭).
      # 함수 파일이 안 바뀐 push 는 건너뜁니다. 손으로 돌리면(workflow_dispatch) 늘 배포합니다.
      - name: 배포할 것인가
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::main 이 이미 $tip 로 나아갔습니다 — 건너뜀"; exit 0
          fi
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(supabase/functions/|supabase/config\.toml$|deno\.lock$)'; then
              echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::서버 함수가 안 바뀜 — 건너뜀"; exit 0
            fi
          fi

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip != '1'
        with:
          version: 2.119.0

      - name: 함수 배포(chat · city-photos · delete-me · push)
        if: steps.gate.outputs.skip != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN 이 비어 있습니다"; exit 1; }
          test -n "$REF" || { echo "::error::SUPABASE_PROJECT_REF 가 비어 있습니다"; exit 1; }
          for f in chat city-photos delete-me push; do
            supabase functions deploy "$f" --project-ref "$REF" --use-api
          done
